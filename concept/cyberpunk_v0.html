<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Interface</title>
    <style>
        :root {
            --neon-pink: #ff2a6d;
            --neon-blue: #05d9e8;
            --neon-purple: #d300c5;
            --dark-bg: #0a0a0f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-blue);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 2rem;
            border: 2px solid var(--neon-pink);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--neon-pink);
            animation: glow 2s infinite alternate;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--neon-blue);
            animation: textGlow 1.5s infinite alternate;
        }

        .terminal {
            background: rgba(0, 0, 0, 0.8);
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
            border: 1px solid var(--neon-purple);
        }

        .terminal-text {
            color: var(--neon-purple);
            font-size: 1.2rem;
            white-space: pre;
            overflow: hidden;
            border-right: 2px solid var(--neon-purple);
            animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        .button {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 0.5rem 1rem;
            margin: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .button:hover {
            background: var(--neon-blue);
            color: var(--dark-bg);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 10px var(--neon-pink);
            }
            to {
                box-shadow: 0 0 20px var(--neon-pink), 0 0 30px var(--neon-purple);
            }
        }

        @keyframes textGlow {
            from {
                text-shadow: 0 0 10px var(--neon-blue);
            }
            to {
                text-shadow: 0 0 20px var(--neon-blue), 0 0 30px var(--neon-purple);
            }
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: var(--neon-purple) }
        }

        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(transparent 0%, rgba(5, 217, 232, 0.1) 2%, transparent 3%),
                linear-gradient(90deg, transparent 0%, rgba(5, 217, 232, 0.1) 2%, transparent 3%);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="container">
        <h1>CYBERPUNK 2077</h1>
        <div class="terminal">
            <div class="terminal-text">> System initialized...
> Welcome to the future...
> Ready for input...</div>
        </div>
        <button class="button" onclick="activateSystem()">Activate System</button>
    </div>

    <script>
        function activateSystem() {
            const terminal = document.querySelector('.terminal-text');
            terminal.textContent = '> System activated...\n> Running diagnostics...\n> All systems operational...';
            terminal.style.animation = 'none';
            setTimeout(() => {
                terminal.style.animation = 'typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite';
            }, 10);
        }
    </script>
</body>
</html>
