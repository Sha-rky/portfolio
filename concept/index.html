<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber HUD Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background-color: #000;
            color: #0ff;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .hud-container {
            position: relative;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .corner {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid #0ff;
            opacity: 0.8;
        }

        .top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .bottom-left {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        .center-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1;
        }

        .title {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0ff;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #0ff;
            opacity: 0.8;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 255, 0.3);
            animation: scan 4s linear infinite;
        }

        .data-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 0.8rem;
            color: #0ff;
            opacity: 0.6;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #0ff;
            }
            to {
                text-shadow: 0 0 20px #0ff, 0 0 30px #0ff;
            }
        }

        @keyframes scan {
            0% {
                top: 0;
            }
            100% {
                top: 100%;
            }
        }

        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(transparent 0%, rgba(0, 255, 255, 0.1) 2%, transparent 3%),
                linear-gradient(90deg, transparent 0%, rgba(0, 255, 255, 0.1) 2%, transparent 3%);
            background-size: 50px 50px;
            opacity: 0.3;
        }

        .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 0%, rgba(0, 255, 255, 0.1) 50%, transparent 100%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
            100% {
                transform: scale(0.95);
                opacity: 0.5;
            }
        }

        /* New HUD Elements */
        .hud-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .health-bar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0ff;
            border-radius: 10px;
            overflow: hidden;
        }

        .health-fill {
            width: 75%;
            height: 100%;
            background: linear-gradient(90deg, #0ff, #00ffaa);
            animation: health-pulse 2s infinite;
        }

        .battery-status {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.8rem;
            color: #0ff;
            opacity: 0.8;
        }

        .network-status {
            position: absolute;
            top: 60px;
            right: 20px;
            font-size: 0.8rem;
            color: #0ff;
            opacity: 0.8;
        }

        .circular-progress {
            position: absolute;
            top: 100px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: conic-gradient(#0ff 0% 75%, transparent 75% 100%);
            border: 2px solid #0ff;
            animation: rotate 4s linear infinite;
        }

        .circular-progress::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: #000;
            border-radius: 50%;
        }

        .data-stream {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-family: monospace;
            font-size: 0.7rem;
            color: #0ff;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
        }

        .data-stream::after {
            content: '|';
            animation: blink 1s infinite;
        }

        @keyframes health-pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .hex-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(60deg, rgba(0, 255, 255, 0.1) 25%, transparent 25.5%, transparent 75%, rgba(0, 255, 255, 0.1) 75%, rgba(0, 255, 255, 0.1)),
                linear-gradient(120deg, rgba(0, 255, 255, 0.1) 25%, transparent 25.5%, transparent 75%, rgba(0, 255, 255, 0.1) 75%, rgba(0, 255, 255, 0.1));
            background-size: 60px 104px;
            opacity: 0.2;
        }

        .status-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #0ff;
            animation: status-pulse 2s infinite;
        }

        @keyframes status-pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hud-container">
        <div class="grid"></div>
        <div class="hex-grid"></div>
        <div class="pulse"></div>
        <div class="scan-line"></div>
        
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="data-overlay">
            SYSTEM STATUS: ONLINE<br>
            TIME: <span id="time">00:00:00</span><br>
            DATE: <span id="date">01/01/2024</span>
        </div>

        <div class="battery-status">
            BATTERY: <span id="battery">87%</span>
        </div>

        <div class="network-status">
            NETWORK: <span id="network">SECURE</span>
        </div>

        <div class="circular-progress"></div>

        <div class="status-indicator">
            <div class="status-dot"></div>
            <div class="status-dot"></div>
            <div class="status-dot"></div>
        </div>

        <div class="health-bar">
            <div class="health-fill"></div>
        </div>

        <div class="data-stream">
            <span id="data-text">INITIALIZING SYSTEM... SCANNING NETWORK... ESTABLISHING SECURE CONNECTION...</span>
        </div>

        <div class="center-content">
            <h1 class="title">CYBER HUD</h1>
            <p class="subtitle">Welcome to the Future</p>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            const timeElement = document.getElementById('time');
            const dateElement = document.getElementById('date');
            
            timeElement.textContent = now.toLocaleTimeString();
            dateElement.textContent = now.toLocaleDateString();
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Simulate data stream
        const dataTexts = [
            "INITIALIZING SYSTEM...",
            "SCANNING NETWORK...",
            "ESTABLISHING SECURE CONNECTION...",
            "ANALYZING THREATS...",
            "OPTIMIZING PERFORMANCE..."
        ];

        let currentTextIndex = 0;
        const dataTextElement = document.getElementById('data-text');

        function updateDataStream() {
            dataTextElement.textContent = dataTexts[currentTextIndex];
            currentTextIndex = (currentTextIndex + 1) % dataTexts.length;
        }

        setInterval(updateDataStream, 3000);
        updateDataStream();

        // Simulate battery drain
        let batteryLevel = 87;
        const batteryElement = document.getElementById('battery');

        function updateBattery() {
            batteryLevel = Math.max(0, batteryLevel - 0.1);
            batteryElement.textContent = Math.round(batteryLevel) + '%';
        }

        setInterval(updateBattery, 10000);
    </script>
</body>
</html>
