<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Animation</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        .text-animation {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="text-animation" id="textAnimation"></div>
    <script>
        const words = ['Apple', 'Banana', 'Cake', 'Doughnut', 'Egg', 'Fish', 'Grape', 'Honey'];
        let currentIndex = 0;
        const textAnimation = document.getElementById('textAnimation');
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';

        function randomChar() {
            return chars[Math.floor(Math.random() * chars.length)];
        }

        function scrambleWord(word, progress) {
            let result = '';
            for (let i = 0; i < word.length; i++) {
                if (i < progress) {
                    result += word[i];
                } else {
                    result += randomChar();
                }
            }
            return result;
        }

        function revealWord(word, callback) {
            let progress = 0;
            let flickerCount = 0;
            const maxFlicker = 4; // 每個字母亂碼閃爍次數
            let display = '';
            const interval = setInterval(() => {
                if (flickerCount < maxFlicker) {
                    // 亂碼閃爍
                    display = '';
                    for (let i = 0; i < word.length; i++) {
                        if (i < progress) {
                            display += word[i];
                        } else {
                            display += randomChar();
                        }
                    }
                    textAnimation.textContent = display;
                    flickerCount++;
                } else {
                    // 顯示正確字母，進入下一個字母
                    progress++;
                    flickerCount = 0;
                    if (progress > word.length) {
                        clearInterval(interval);
                        if (callback) callback();
                        return;
                    }
                }
            }, 40); // 亂碼閃爍速度
        }

        function showNextWord() {
            const word = words[currentIndex];
            revealWord(word, () => {
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % words.length;
                    showNextWord();
                }, 2000);
            });
        }

        showNextWord();
    </script>
</body>
</html>
